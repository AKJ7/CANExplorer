[project]
name = "can-explorer"
version = "1.3.0"
description = "Monitor, analyse, diagnose, simulate and test CAN, CAN FD and LIN buses"
authors = [{ name = "AKJ7", email = "akj123429@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["can", "can-fd", "lin", "canbus", "automotive", "uds", "j1939", "canopen", "ethercat", "gvret", "elm327", "obdlink", "j2534", "dbc", "python-can"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6~=6.9.0",
    "python-can[serial]",
    "cantools",
    "qasync",
    "pydantic-settings",  # Settings from options, environment variables and .env files
    # can-server and its client (RemoteBus); click for the can-server command line
    "aiohttp",
    "click",
    "ldfparser==0.26.0",  # Pinned: pre-1.0, minor versions may break the API
]

[project.urls]
Homepage = "https://github.com/AKJ7/CANExplorer"
Documentation = "https://akj7.github.io/CANExplorer/"
Repository = "https://github.com/AKJ7/CANExplorer"
Issues = "https://github.com/AKJ7/CANExplorer/issues"
Changelog = "https://github.com/AKJ7/CANExplorer/blob/develop/CHANGELOG.md"

[project.scripts]
canexplorer = "can_explorer.__main__:main"
can-db-convert = "can_explorer.db_convert:main"
can-test = "can_explorer.testing.cli:main"
can-server = "can_server.__main__:main"

[project.entry-points."can.interface"]
# Remote buses shared with can-server, usable as python-can interface "canexplorer_remote" (class RemoteBus)
canexplorer_remote = "can_explorer.core.remote:RemoteBus"
# GVRET devices (SavvyCAN protocol: ESP32RET, Macchina M2, CANDue), usable as python-can interface "gvret"
gvret = "can_explorer.core.gvret:GvretBus"
# ELM327 and OBDLink OBD adapters (USB, Bluetooth, WiFi), usable as python-can interface "elm327"
elm327 = "can_explorer.core.elm327:Elm327Bus"
# J2534 pass-thru devices (SAE J2534-1 04.04 drivers), usable as python-can interface "j2534"
j2534 = "can_explorer.core.j2534:J2534Bus"

[project.optional-dependencies]
mf4 = [
    "asammdf>=7",
]
# Real EtherCAT adapters for the EtherCAT (CoE) tool, through SOEM. Not bundled in the installers: SOEM is GPLv2 with
# a linking exception, and its license asks distributors of an EtherCAT master to obtain Beckhoff's master license
ethercat = [
    "pysoem>=1.1.13",
]
# USB I/O adapters (aio_usb) for the Physical I/O tool: pyusb, and libusb for Windows and macOS
io = [
    "pyusb>=1.3",
    "libusb-package>=1.0.26",
]
# python-can interfaces that need packages of their own (neoVI, NI-XNET, CANalyst-II, CANtact, gs_usb, UDP multicast)
drivers = [
    "python-can[neovi,nixnet,canalystii,cantact,gs-usb,multicast]",
]
mqtt = [
    "aiomqtt>=2.3",
]

[dependency-groups]
dev = [
    "rust-just",
    "black",
    "mypy",
    "pre-commit",
    "docutils",
    "ruff",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-qt",
    "pytest-mock",
    "hypothesis",
    "asammdf>=7",  # MF4 log files in the format round-trip tests
]
packaging = [
    "nuitka>=4.3.1",
    "patchelf>=0.19.1.0 ; sys_platform == 'linux'",
    "pyinstaller",
    "zstandard>=0.25.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv]
default-groups = ["dev", "test", "packaging"]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = "True"
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = "tests"
asyncio_mode = "auto"

[tool.black]
line-length = 120
include = ".pyi?$"
skip-string-normalization = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["can_explorer", "can_server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B"]
# QModelIndex() as a default argument is the standard Qt model idiom
ignore = ["B008"]
