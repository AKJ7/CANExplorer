[project]
name = "can-explorer"
version = "0.0.1"
description = "CAN analysis tool for all platform"
authors = [{ name = "AKJ7", email = "akj123429@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ['canbus', 'can', 'gui', 'analyze']
requires-python = ">=3.10"
dependencies = [
    "PyQt6~=6.9.0",
    "python-can[serial]",
    "cantools",
    "qasync",
    "pydantic",
    "pydantic-settings",
    # can_server
    "aiohttp",
    "click",
    "ldfparser==0.26.0",  # Pinned: pre-1.0, minor versions may break the API
]

[project.scripts]
main = "can_explorer.__main__:main"
can-db-convert = "can_explorer.db_convert:main"
can-test = "can_explorer.testing.cli:main"

[project.optional-dependencies]
mf4 = [
    "asammdf>=7",
]

[dependency-groups]
dev = [
    "rust-just",
    "black",
    "mypy",
    "pre-commit",
    "docutils",
    "ruff",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-qt",
    "pytest-mock",
    "hypothesis",
    "asammdf>=7",  # MF4 log files in the format round-trip tests
]
packaging = [
    "nuitka>=4.3.1",
    "patchelf>=0.19.1.0 ; sys_platform == 'linux'",
    "pyinstaller",
    "zstandard>=0.25.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv]
default-groups = ["dev", "test", "packaging"]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = "True"
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = "tests"
asyncio_mode = "auto"

[tool.black]
line-length = 120
include = ".pyi?$"
skip-string-normalization = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["can_explorer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B"]
# QModelIndex() as a default argument is the standard Qt model idiom
ignore = ["B008"]
