[project]
name = "can-explorer"
version = "0.0.1"
description = "CAN analysis tool for all platform"
authors = [{ name = "AKJ7", email = "akj123429@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ['canbus', 'can', 'gui', 'analyze']
requires-python = ">=3.10"
dependencies = [
    "rust-just",
    "PyQt6~=6.9.0",
    "pyinstaller",
    "python-can",
    "cantools",
    "click",
    # "aiofile",
    "aiohttp",
    "matplotlib",
    "numpy",
    "schema",
    "qasync",
    "qtrio",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
main = "can_explorer.__main__:main"

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pre-commit",
    # "reportlab",
    "docutils",
    "ruff",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-schema",
    "pytest-qt",
    "pytest-mock",
    "hypothesis",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = "True"
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = "tests"
asyncio_mode = "auto"

#[tool.pylint]
#disable = C0111, C0114, C0115, C0116б, W1203, missing-module-docstring, missing-class-docstring, disable=missing-function-docstring
#
[tool.black]
line-length = 120
include = ".pyi?$"
#exclude = .git
#          | \.hg
#          | \.mypy_cache
#          | \.tox
#          | \.venv
#          | _build
#          | buck-out
#          | build
#          | dist
skip-string-normalization = true

#[options.entry_points]
#console_scripts =

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["can_explorer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B"]
# QModelIndex() as a default argument is the standard Qt model idiom
ignore = ["B008"]
