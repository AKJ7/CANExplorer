site_name: CANExplorer
site_description: Cross-platform CAN and LIN bus monitoring, diagnostics and simulation
site_url: https://akj7.github.io/CANExplorer/
repo_url: https://github.com/AKJ7/CANExplorer
repo_name: AKJ7/CANExplorer
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2024–2026 AKJ7

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    scheme: slate  # Recoloured to Dracula by docs/stylesheets/dracula.css
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - User guide:
      - user-guide/index.md
      - Connections: user-guide/connections.md
      - Trace and overview: user-guide/trace-and-overview.md
      - Filters: user-guide/filters.md
      - Bus health: user-guide/bus-health.md
      - Reverse engineering: user-guide/reverse-engineering.md
      - Recording, replay and export: user-guide/recording-and-replay.md
      - Comparing recordings: user-guide/compare-recordings.md
      - Several buses: user-guide/multi-bus.md
      - Remote buses: user-guide/remote-buses.md
      - MQTT: user-guide/mqtt.md
      - Signal databases: user-guide/signal-databases.md
      - Database editor: user-guide/database-editor.md
      - Signal plots: user-guide/signal-plots.md
      - Transmitting: user-guide/transmitting.md
      - Protocol decoding: user-guide/protocols.md
      - Diagnostics (UDS): user-guide/diagnostics.md
      - Flashing: user-guide/flashing.md
      - J1939: user-guide/j1939.md
      - CANopen: user-guide/canopen.md
      - EtherCAT (CoE): user-guide/ethercat.md
      - Physical I/O: user-guide/physical-io.md
      - LIN: user-guide/lin.md
      - Simulation and scripting: user-guide/simulation.md
      - Test automation: user-guide/test-automation.md
      - Workspaces: user-guide/workspaces.md
      - Preferences and settings: user-guide/preferences.md
      - Updates: user-guide/updates.md
  - Reference:
      - reference/index.md
      - Scripting API: reference/scripting-api.md
      - Test API: reference/test-api.md
      - QML panel API: reference/panel-api.md
      - Supported interfaces: reference/interfaces.md
      - Command line: reference/command-line.md
      - File formats: reference/file-formats.md
      - Keyboard shortcuts: reference/keyboard-shortcuts.md
      - Links: reference/links.md
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Building and testing: development/building.md
      - Packaging: development/packaging.md
      - Translations: development/translations.md
      - Contributing: development/contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            heading_level: 3
            filters: ["!^_"]
            merge_init_into_class: true

extra_css:
  - stylesheets/dracula.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AKJ7/CANExplorer
