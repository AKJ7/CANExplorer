name: installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      backend:
        description: Packaging backend
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller

env:
  # Tag builds use PyInstaller; Nuitka can be chosen when starting the workflow manually
  BACKEND: ${{ inputs.backend || 'pyinstaller' }}
  # Same cache location on every runner, so it can be restored between runs
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

jobs:
  bundle:
    name: Bundle for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Nuitka compiles everything to C, which takes considerably longer than PyInstaller
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group packaging
      - name: Cache Nuitka compilation
        if: env.BACKEND == 'nuitka'
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-
      - name: Build bundle
        run: uv run python packaging/build.py --backend ${{ env.BACKEND }} --archive
      - uses: actions/upload-artifact@v4
        with:
          name: CANExplorer-${{ runner.os }}-${{ env.BACKEND }}
          path: dist/CANExplorer-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
