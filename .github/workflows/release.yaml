name: release

# Builds the installers for Windows (setup.exe), Linux (AppImage, .deb) and macOS (.dmg) plus portable zip archives.
# - Pushes and merges to master: the installers are published to GitHub Packages, as the OCI artifact
#   ghcr.io/<owner>/canexplorer-installers (tags: the version, sha-<commit> and latest; `oras pull` downloads them).
# - Tags v*: the installers are attached to a GitHub release of the tag (a pre-release for tags such as v1.0.0-rc1).
# - Manual runs and pull requests changing the packaging: the installers are stored as workflow artifacts only.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
    paths:
      - "packaging/**"
      - ".github/workflows/release.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      backend:
        description: Packaging backend
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tags and pull requests use PyInstaller; Nuitka can be chosen when starting the workflow manually
  BACKEND: ${{ inputs.backend || 'pyinstaller' }}
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version of pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.version.outputs.version }} in pyproject.toml"
            exit 1
          fi

  installers:
    name: Installers for ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    # Nuitka compiles everything to C, which takes considerably longer than PyInstaller
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          # The oldest supported Ubuntu: the bundle runs on distributions with this glibc or a newer one
          - platform: linux
            os: ubuntu-22.04
          # Apple silicon
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
          libxcb-cursor0 libfontconfig1 libdbus-1-3 file desktop-file-utils
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group packaging
      - name: Cache Nuitka compilation
        if: env.BACKEND == 'nuitka'
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build the bundle
        run: uv run python packaging/build.py --backend ${{ env.BACKEND }} --archive
      - name: Build the installers
        run: uv run python packaging/installer.py

      # Install (or mount) every installer and start the installed application with --help
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/installers/*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'CANExplorer'
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", '/LOG=install.log' -Wait
          if (-not (Test-Path "$dir\CANExplorer.exe")) { Get-Content install.log; exit 1 }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\CANExplorer.exe") { Write-Error 'The uninstaller left the application behind'; exit 1 }
      - name: Test the Linux installers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/installers/*.deb
          canexplorer --help
          desktop-file-validate /usr/share/applications/io.github.akj7.CANExplorer.desktop
          sudo apt-get remove -y canexplorer
          chmod +x dist/installers/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/installers/*.AppImage --help
      - name: Test the macOS disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/installers/*.dmg -mountpoint /Volumes/CANExplorer -nobrowse -quiet
          /Volumes/CANExplorer/CANExplorer.app/Contents/MacOS/CANExplorer --help
          test -L /Volumes/CANExplorer/Applications
          hdiutil detach /Volumes/CANExplorer -quiet

      - name: Store the installers
        uses: actions/upload-artifact@v4
        with:
          name: CANExplorer-${{ needs.version.outputs.version }}-${{ matrix.platform }}-${{ env.BACKEND }}
          path: |
            dist/installers/*
            dist/CANExplorer-*.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0  # The installers are compressed already

  package:
    name: Publish to GitHub Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: oras-project/setup-oras@v1
      - name: Push the installers to ghcr.io
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"  # Package names are lower case
          package="ghcr.io/$owner/canexplorer-installers"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          files=()
          for file in *; do files+=("$file:application/octet-stream"); done
          oras push "$package:$VERSION,sha-${GITHUB_SHA::7},latest" "${files[@]}" \
            --artifact-type application/vnd.canexplorer.installers.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=CANExplorer installers for Windows, Linux and macOS" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.licenses=MIT"
          {
            echo "## Installers published to GitHub Packages"
            echo
            echo "\`$package\` with the tags \`$VERSION\`, \`sha-${GITHUB_SHA::7}\` and \`latest\`:"
            echo
            echo '```bash'
            echo "oras pull $package:sha-${GITHUB_SHA::7}"
            echo '```'
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for file in *; do echo "| $file | $(du -h "$file" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: CANExplorer ${{ needs.version.outputs.version }}
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Installer | Portable |
            |---|---|---|
            | Windows 10/11 (x64) | `CANExplorer-${{ needs.version.outputs.version }}-windows-x86_64-setup.exe` | `…-windows-x86_64.zip` |
            | Linux (x86-64, glibc 2.35+) | `….AppImage` (any distribution), `….deb` (Debian, Ubuntu) | `…-linux-x86_64.zip` |
            | macOS (Apple silicon) | `CANExplorer-${{ needs.version.outputs.version }}-macos-arm64.dmg` | `…-macos-arm64.zip` |

            The installers are not code signed yet: on Windows choose *More info → Run anyway* in the SmartScreen
            dialog, on macOS open the app with a right click → *Open* the first time. `SHA256SUMS.txt` lists the
            checksums of all files.
