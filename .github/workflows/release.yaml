name: release

# Builds the installers for Windows (setup.exe), Linux (AppImage, .deb) and macOS (.dmg) plus portable zip archives.
# - Pushes and merges to master: the installers are published to GitHub Packages, as the OCI artifact
#   ghcr.io/<owner>/canexplorer-installers (tags: the version, sha-<commit> and latest; `oras pull` downloads them).
# - Tags v*: the installers are attached to a GitHub release of the tag (a pre-release for tags such as v1.0.0-rc1),
#   and the snap is published to the Snap Store: stable, or candidate for -rc tags and beta for other pre-releases.
#   Publishing needs the repository secret SNAPCRAFT_STORE_CREDENTIALS (`snapcraft export-login --snaps canexplorer
#   --acls package_access,package_push,package_release -`).
# - Manual runs and pull requests changing the packaging: the installers are stored as workflow artifacts only.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
    paths:
      - "packaging/**"
      - "snap/**"
      - ".github/workflows/release.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      backend:
        description: Packaging backend
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pushes, tags and pull requests use PyInstaller; Nuitka can be chosen when starting the workflow manually
  BACKEND: ${{ inputs.backend || 'pyinstaller' }}
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version of pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.version.outputs.version }} in pyproject.toml"
            exit 1
          fi

  installers:
    name: Installers for ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    # Nuitka compiles everything to C, which takes considerably longer than PyInstaller (cached between runs)
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          # The oldest supported Ubuntu: the bundle runs on distributions with this glibc or a newer one
          - platform: linux
            os: ubuntu-22.04
          # Apple silicon
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
          libxcb-cursor0 libfontconfig1 libdbus-1-3 file desktop-file-utils
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install dependencies
        # MQTT (aiomqtt, paho-mqtt: small and pure Python) is part of the installers
        run: uv sync --locked --no-default-groups --group packaging --extra mqtt
      - name: Cache Nuitka compilation
        if: env.BACKEND == 'nuitka'
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      # The J2534 bridge runs 32-bit J2534 drivers, which the 64-bit application cannot load: a 32-bit program
      # built with a 32-bit Python (standard library only, plus PyInstaller to build it)
      - name: Install the 32-bit Python of the J2534 bridge
        if: runner.os == 'Windows'
        run: |
          uv venv build/j2534-bridge-python --python cpython-3.12-windows-x86-none
          uv pip install --python build/j2534-bridge-python pyinstaller==6.22.3

      - name: Build the bundle
        run: >
          uv run python packaging/build.py --backend ${{ env.BACKEND }} --archive
          ${{ runner.os == 'Windows' && '--j2534-bridge build/j2534-bridge-python/Scripts/python.exe' || '' }}
      - name: Build the installers
        run: uv run python packaging/installer.py

      # Install (or mount) every installer and start the installed application with --help
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/installers/*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'CANExplorer'
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", '/LOG=install.log' -Wait
          if (-not (Test-Path "$dir\CANExplorer.exe")) { Get-Content install.log; exit 1 }
          # The J2534 bridge starts and answers (its first line announces the protocol)
          $hello = '["exit"]' | & "$dir\j2534-bridge32\j2534-bridge32.exe" | Select-Object -First 1
          if ($hello -notmatch '"bridge": 1') { Write-Error "The J2534 bridge did not start: $hello"; exit 1 }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$dir\CANExplorer.exe") { Write-Error 'The uninstaller left the application behind'; exit 1 }
      - name: Test the Linux installers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/installers/*.deb
          canexplorer --help
          desktop-file-validate /usr/share/applications/io.github.akj7.CANExplorer.desktop
          sudo apt-get remove -y canexplorer
          chmod +x dist/installers/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/installers/*.AppImage --help
      - name: Test the macOS disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/installers/*.dmg -mountpoint /Volumes/CANExplorer -nobrowse -quiet
          /Volumes/CANExplorer/CANExplorer.app/Contents/MacOS/CANExplorer --help
          test -L /Volumes/CANExplorer/Applications
          # Detaching fails with "resource busy" (exit 16) while Spotlight still indexes the fresh volume or the
          # app's process lets go of it: retry, then force it
          for attempt in 1 2 3 4 5; do
            hdiutil detach /Volumes/CANExplorer -quiet && exit 0
            echo "Volume busy, retrying ($attempt)"
            sleep 2
          done
          hdiutil detach /Volumes/CANExplorer -force -quiet

      # One flat folder: artifacts keep the paths below the common parent, so files from dist/installers and dist
      # would arrive in different folders, and the jobs below expect all files side by side
      - name: Collect the files
        shell: bash
        run: |
          mkdir -p dist/upload
          cp dist/installers/* dist/CANExplorer-*.zip dist/upload/
          ls -l dist/upload
      - name: Store the installers
        uses: actions/upload-artifact@v4
        with:
          name: CANExplorer-${{ needs.version.outputs.version }}-${{ matrix.platform }}-${{ env.BACKEND }}
          path: dist/upload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0  # The installers are compressed already

  snap:
    name: Snap
    needs: version
    # The release of the core22 base: the bundle uses its C library
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Qt system libraries
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
          libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group packaging --extra mqtt
      - name: Build the bundle
        run: uv run python packaging/build.py --backend pyinstaller
      - name: Build the snap
        id: build
        uses: snapcore/action-build@v1
      - name: Test the snap
        run: |
          sudo snap install --dangerous ${{ steps.build.outputs.snap }}
          snap info --verbose ${{ steps.build.outputs.snap }} | head -n 20
          canexplorer --help
          sudo snap remove canexplorer
      - name: Store the snap
        uses: actions/upload-artifact@v4
        with:
          name: canexplorer-snap-${{ needs.version.outputs.version }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Choose the channel
        id: channel
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc*) channel=candidate ;;
            *-*) channel=beta ;;
            *) channel=stable ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Publish to the Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}

  package:
    name: Publish to GitHub Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: CANExplorer-*  # The installers (the snap goes to the Snap Store)
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: oras-project/setup-oras@v1
      - name: Push the installers to ghcr.io
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"  # Package names are lower case
          package="ghcr.io/$owner/canexplorer-installers"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          files=()
          for file in *; do files+=("$file:application/octet-stream"); done
          oras push "$package:$VERSION,sha-${GITHUB_SHA::7},latest" "${files[@]}" \
            --artifact-type application/vnd.canexplorer.installers.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=CANExplorer installers for Windows, Linux and macOS" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.licenses=MIT"
          {
            echo "## Installers published to GitHub Packages"
            echo
            echo "\`$package\` with the tags \`$VERSION\`, \`sha-${GITHUB_SHA::7}\` and \`latest\`:"
            echo
            echo '```bash'
            echo "oras pull $package:sha-${GITHUB_SHA::7}"
            echo '```'
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for file in *; do echo "| $file | $(du -h "$file" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: CANExplorer-*  # The installers (the snap goes to the Snap Store)
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The version's section of CHANGELOG.md (also shown by the update dialog of the application)
          awk -v heading="## [$VERSION]" '
            /^## / { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
          fi
          cat >> release-notes.md <<'NOTES'

          ## Downloads

          | Platform | Installer | Portable |
          |---|---|---|
          | Windows 10/11 (x64) | `CANExplorer-VERSION-windows-x86_64-setup.exe` | `CANExplorer-VERSION-windows-x86_64.zip` |
          | Linux (x86-64, glibc 2.35+) | `CANExplorer-VERSION-linux-x86_64.AppImage` (any distribution), `CANExplorer-VERSION-linux-x86_64.deb` (Debian, Ubuntu), or `sudo snap install canexplorer` | `CANExplorer-VERSION-linux-x86_64.zip` |
          | macOS (Apple silicon) | `CANExplorer-VERSION-macos-arm64.dmg` | `CANExplorer-VERSION-macos-arm64.zip` |

          Installed copies of CANExplorer 1.0.0 and later offer this update themselves (⋮ → Check for Updates…).
          The installers are not code signed yet: on Windows choose *More info → Run anyway* in the SmartScreen
          dialog, on macOS open the app with a right click → *Open* the first time. `SHA256SUMS.txt` lists the
          checksums of all files.
          NOTES
          sed -i "s/VERSION/$VERSION/g" release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: CANExplorer ${{ needs.version.outputs.version }}
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
