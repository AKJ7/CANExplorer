# Snap of CANExplorer, built from the PyInstaller bundle of packaging/build.py (dist/CANExplorer), which must exist
# before snapcraft runs (the release workflow builds it on Ubuntu 22.04, the release of the core22 base):
#
#   uv run python packaging/build.py && snapcraft
#
# Strict confinement: hardware is reached through interfaces the user connects once (see the description).
name: canexplorer
title: CANExplorer
summary: Monitor, analyse, diagnose and simulate CAN, CAN FD and LIN buses
description: |
  CANExplorer is a cross-platform workbench for CAN, CAN FD and LIN buses — for engineers, tuners and hobbyists
  working on vehicles and embedded networks. It works with any python-can adapter, or on a virtual bus with no
  hardware at all.

  * Live trace and dashboard with decoded signals (DBC, DBF, ARXML, KCD, SYM, LDF), frame rates, bus load and the
    busiest identifiers, handling millions of frames.
  * Signal plots with cursors and CSV export, and bus health: error states, TEC/REC and load over time.
  * Recording and replay in ASC, BLF, CSV, candump LOG, PEAK TRC, SQLite, ASAM MF4 and gzip, with triggered and
    split recording, replay onto a bus, and recording comparison.
  * Reverse engineering of an unknown bus: bit and byte statistics, automatic detection of checksums, counters,
    multiplexers and values, reference signals, and a scripting console.
  * Diagnostics and protocols: UDS over ISO-TP, ECU flashing, DoIP, J1939, CANopen, XCP/CCP, GMLAN and GM Class 2
    (SAE J1850 VPW), with simulated ECUs to try without hardware.
  * A signal database editor for CAN and LIN, simulated nodes with control panels, test automation with HTML and
    JUnit reports, remote buses and MQTT publishing.

  Connect the interfaces for your hardware once after installing:

      sudo snap connect canexplorer:can-bus   # SocketCAN adapters: can0, vcan0 …
      sudo snap connect canexplorer:raw-usb   # USB adapters: candleLight/gs_usb, slcan, ELM327, GVRET …

  Vendor driver libraries installed on the computer (PCAN-Basic, Kvaser CANlib) cannot be used from the snap; on
  Linux these adapters work through SocketCAN.
license: MIT
website: https://akj7.github.io/CANExplorer/
source-code: https://github.com/AKJ7/CANExplorer
issues: https://github.com/AKJ7/CANExplorer/issues
icon: can_explorer/resources/icons/256.png
base: core22
grade: stable
confinement: strict
adopt-info: canexplorer
architectures:
  - build-on: amd64

apps:
  canexplorer:
    command: opt/canexplorer/CANExplorer
    extensions: [gnome]
    common-id: io.github.akj7.CANExplorer
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      - can-bus # SocketCAN
      - raw-usb # libusb adapters and USB serial adapters (/dev/ttyUSB*, /dev/ttyACM*)
      - hardware-observe # Listing serial ports and USB devices

parts:
  canexplorer:
    plugin: nil
    source: dist/CANExplorer
    # Adopt the screenshots (and other metadata not set above) from the AppStream metainfo file
    parse-info: [usr/share/metainfo/io.github.akj7.CANExplorer.metainfo.xml]
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$CRAFT_PROJECT_DIR/pyproject.toml" | head -n 1)"
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/opt/canexplorer"
      cp -a "$CRAFT_PART_SRC/." "$CRAFT_PART_INSTALL/opt/canexplorer/"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/metainfo"
      cp "$CRAFT_PROJECT_DIR/packaging/io.github.akj7.CANExplorer.metainfo.xml" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/"
    # Libraries of Qt's xcb platform plugin and of the bundled Python that the gnome extension's runtime lacks
    stage-packages:
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-util1
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libgssapi-krb5-2
